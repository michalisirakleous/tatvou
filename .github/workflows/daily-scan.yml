name: Daily market scan

on:
  schedule:
    # 22:00 UTC weekdays — an hour after the US close (16:00 ET / 21:00 UTC).
    # GitHub's scheduler is best-effort and can run 5-30 minutes late when the
    # platform is busy. Fine for a daily page; not for anything time-critical.
    - cron: "0 22 * * 1-5"
  workflow_dispatch:        # lets you trigger it by hand from the Actions tab

permissions:
  contents: write           # to commit the updated page

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install --quiet pandas numpy yfinance tabulate

      - name: Run the scan
        run: python scan.py

      - name: Publish the page
        run: |
          mkdir -p archive
          cp brief.md "archive/$(date -u +%Y-%m-%d).md"
          cp latest_scan.csv archive/latest_scan.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs archive
          git commit -m "Scan $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push
